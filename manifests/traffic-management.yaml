apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: hello-gateway
  namespace: istio-playground
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "hello.local"
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: hello
  namespace: istio-playground
spec:
  host: hello.istio-playground.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hello
  namespace: istio-playground
spec:
  hosts:
    - "hello.local"
  gateways:
    - hello-gateway
  http:
    - route:
        - destination:
            host: hello.istio-playground.svc.cluster.local
            subset: v1
            port:
              number: 8080
          weight: 80
        - destination:
            host: hello.istio-playground.svc.cluster.local
            subset: v2
            port:
              number: 8080
          weight: 20
